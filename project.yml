# NitraX für iPhone – Projektbeschreibung für XcodeGen (erzeugt NitraX.xcodeproj auf dem Mac/in der Cloud).
# Team-ID kommt aus der Umgebung: DEVELOPMENT_TEAM (GitHub-Secret APPLE_TEAM_ID).
name: NitraX
options:
  bundleIdPrefix: de.infinitras
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.5.4"           # TestFlight nimmt die Datei VERSION (bei jedem Update hochzählen)
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  NitraX:
    type: application
    platform: iOS
    sources:
      - path: NitraX
      - path: Shared
    info:
      path: NitraX/Info.plist
      properties:
        CFBundleDisplayName: NitraX
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: de.infinitras.nitrax
            CFBundleURLSchemes: [nitrax]
        UILaunchScreen:
          UIColorName: Splash
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch, processing, voip, audio, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [de.infinitras.nitrax.abholen]
        NSCameraUsageDescription: Zum Scannen des QR-Codes, für Fotos als Startbild und damit dein Helfer dich sehen kann (nur wenn du die Augen einschaltest, nichts wird gespeichert).
        NSMicrophoneUsageDescription: Zum Aufnehmen von Melodien und zum Sprechen mit deinem Helfer.
        NSPhotoLibraryAddUsageDescription: Damit du fertige Bilder und Videos in deine Fotos sichern kannst.
        NSLocalNetworkUsageDescription: NitraX verbindet sich mit deinem PC im Heimnetz (NitraX AI Studio).
        NSFaceIDUsageDescription: Damit nur du NitraX öffnen kannst.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    entitlements:
      path: NitraX/NitraX.entitlements
      properties:
        com.apple.security.application-groups: [group.de.infinitras.nitrax]
        aps-environment: $(APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.infinitras.nitrax
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Neon AppIcon-Dunkel"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PROVISIONING_PROFILE_SPECIFIER: $(NX_PROFIL_APP)
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    dependencies:
      - target: NitraXWidget
      - target: NitraXTeilen
      - target: NitraXMitteilung
  NitraXWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"           # Kontrollzentrum-Steuerelement (ControlWidget) gibt es ab iOS 18
    sources:
      - path: NitraXWidget
      - path: Shared
    info:
      path: NitraXWidget/Info.plist
      properties:
        CFBundleDisplayName: NitraX
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    entitlements:
      path: NitraXWidget/NitraXWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.de.infinitras.nitrax]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.infinitras.nitrax.widget
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NX_ERWEITERUNG"
        PROVISIONING_PROFILE_SPECIFIER: $(NX_PROFIL_WIDGET)
        SKIP_INSTALL: YES
  NitraXTeilen:
    type: app-extension
    platform: iOS
    sources:
      - path: NitraXTeilen
      - path: Shared
    info:
      path: NitraXTeilen/Info.plist
      properties:
        CFBundleDisplayName: An NitraX
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).TeilenController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 4
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    entitlements:
      path: NitraXTeilen/NitraXTeilen.entitlements
      properties:
        com.apple.security.application-groups: [group.de.infinitras.nitrax]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.infinitras.nitrax.teilen
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NX_ERWEITERUNG"
        PROVISIONING_PROFILE_SPECIFIER: $(NX_PROFIL_TEILEN)
        SKIP_INSTALL: YES
  NitraXMitteilung:
    type: app-extension
    platform: iOS
    sources:
      - path: NitraXMitteilung
    info:
      path: NitraXMitteilung/Info.plist
      properties:
        CFBundleDisplayName: NitraX Mitteilungen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MitteilungDienst
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.infinitras.nitrax.mitteilung
        PROVISIONING_PROFILE_SPECIFIER: $(NX_PROFIL_MITTEILUNG)
        SKIP_INSTALL: YES
schemes:
  NitraX:
    build:
      targets:
        NitraX: all
        NitraXWidget: all
        NitraXTeilen: all
        NitraXMitteilung: all
    run:
      config: Debug
    archive:
      config: Release
